        <div class="main-container  box">
        <form>
                <div class="input_pair">
                    <label for="user_name" id="label_name" >Your name</label>
                    <input type="text" placeholder="Fill your name" name="name" id="name" required></input>
                </div>
                <div class="input_pair">
                    <label for="user_email" id="label_email">Your email</label>
                    <input type="email" placeholder="Fill your email" name="email" id="email"></input>
                </div>
                <div class="input_pair">
                    <label for="user_message" id="label_message" >Your message</label>
                    <textarea placeholder="Fill your message" name="message" rows="5" id="message" required></textarea>
                </div>
                <button type="submit" class="submit">Send</button>
            </form>
            </div>
